name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx eslint src scripts
      - name: Engine tests
        run: |
          for t in scripts/test-*.ts; do
            echo "::group::$t"
            npx tsx "$t"
            echo "::endgroup::"
          done
