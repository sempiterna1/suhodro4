<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- Фитиль, подрывник. Растрёпанные волосы, красный шарф, кожаная куртка, шахтный заряд с фитилём -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1710"/>
      <stop offset="1" stop-color="#0e0d12"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="0.5" stop-color="#d4a85a"/>
      <stop offset="1" stop-color="#7d5a2c"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a2e"/>
      <stop offset="1" stop-color="#3f2a18"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdc4a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ff8a1e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crater" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#c8501a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c8501a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="240" fill="url(#bg)"/>
  <!-- кратер и угольки внизу -->
  <ellipse cx="100" cy="250" rx="130" ry="70" fill="url(#crater)"/>
  <g fill="#ff8a1e">
    <circle cx="36" cy="196" r="2.2" opacity="0.9"/><circle cx="24" cy="170" r="1.6" opacity="0.6"/>
    <circle cx="172" cy="150" r="1.8" opacity="0.7"/><circle cx="160" cy="204" r="2.2" opacity="0.8"/>
    <circle cx="184" cy="184" r="1.4" opacity="0.5"/><circle cx="48" cy="142" r="1.4" opacity="0.5"/>
  </g>
  <g fill="#2c2925">
    <rect x="0" y="26" width="200" height="8"/>
    <rect x="0" y="26" width="200" height="3" fill="#3a362f"/>
  </g>

  <!-- плечи, куртка -->
  <path d="M 32 226 L 42 172 Q 56 148 82 144 L 118 144 Q 144 148 158 172 L 168 226 Z" fill="url(#coat)" stroke="#140d07" stroke-width="2.5"/>
  <path d="M 42 172 Q 56 148 82 144 L 92 144 L 68 226 L 32 226 Z" fill="#241708" opacity="0.4"/>
  <!-- открытый ворот, тёмная рубаха -->
  <path d="M 86 148 L 100 176 L 114 148 L 100 142 Z" fill="#241708" stroke="#140d07" stroke-width="2"/>
  <path d="M 86 148 L 96 176 L 82 168 Z" fill="#5a3d24" stroke="#140d07" stroke-width="2"/>
  <path d="M 114 148 L 104 176 L 118 168 Z" fill="#5a3d24" stroke="#140d07" stroke-width="2"/>
  <!-- строчка на куртке -->
  <path d="M 50 190 Q 46 208 50 226" fill="none" stroke="#3f2a18" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 150 190 Q 154 208 150 226" fill="none" stroke="#3f2a18" stroke-width="2" stroke-dasharray="4 4"/>
  <g fill="url(#brass)" stroke="#140d07" stroke-width="1.5">
    <circle cx="100" cy="196" r="3.5"/><circle cx="100" cy="214" r="3.5"/>
  </g>

  <!-- красный шарф -->
  <path d="M 78 138 Q 100 152 122 138 Q 128 148 122 158 Q 100 168 78 158 Q 72 148 78 138 Z" fill="#b03a32" stroke="#140d07" stroke-width="2.5"/>
  <path d="M 118 156 L 128 200 L 116 196 L 112 158 Z" fill="#b03a32" stroke="#140d07" stroke-width="2"/>
  <path d="M 120 164 L 128 198" stroke="#6e2220" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- шея и голова -->
  <rect x="90" y="122" width="20" height="24" rx="8" fill="#d09b70" stroke="#140d07" stroke-width="2"/>
  <circle cx="100" cy="98" r="33" fill="#e8b48a" stroke="#140d07" stroke-width="2.5"/>
  <path d="M 100 65 A 33 33 0 0 1 133 98 L 100 98 Z" fill="#f2c9a0" opacity="0.35"/>

  <!-- растрёпанные волосы -->
  <path d="M 68 96 Q 64 74 78 62 Q 74 72 80 70 Q 78 78 86 72 Q 88 64 100 62 Q 112 64 114 72 Q 122 78 120 70 Q 126 72 122 62 Q 136 74 132 96 Q 128 78 118 76 Q 108 70 100 72 Q 92 70 82 76 Q 72 78 68 96 Z" fill="#c06a2a" stroke="#140d07" stroke-width="2.5"/>
  <path d="M 66 96 Q 62 110 66 122 Q 72 112 70 100 Z" fill="#c06a2a" stroke="#140d07" stroke-width="1.5"/>
  <path d="M 134 96 Q 138 110 134 122 Q 128 112 130 100 Z" fill="#c06a2a" stroke="#140d07" stroke-width="1.5"/>

  <!-- весёлое лицо подрывника -->
  <path d="M 82 90 Q 88 85 94 89" fill="none" stroke="#3f2a18" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 118 90 Q 112 85 106 89" fill="none" stroke="#3f2a18" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="90" cy="98" r="3.2" fill="#241708"/>
  <circle cx="110" cy="98" r="3.2" fill="#241708"/>
  <circle cx="91" cy="97" r="1" fill="#ffd76a"/>
  <circle cx="111" cy="97" r="1" fill="#ffd76a"/>
  <!-- ухмылка с прищуром -->
  <path d="M 88 110 Q 100 122 112 108" fill="none" stroke="#3f2a18" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 108 108 Q 112 108 114 106" fill="none" stroke="#3f2a18" stroke-width="2.2" stroke-linecap="round"/>
  <!-- копоть на щеке -->
  <path d="M 74 104 Q 78 102 80 106" stroke="#3c4046" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- шахтный заряд -->
  <g>
    <circle cx="122" cy="188" r="27" fill="#3c4046" stroke="#140d07" stroke-width="2.5"/>
    <path d="M 104 176 A 27 27 0 0 1 138 168" fill="none" stroke="#61666d" stroke-width="5" stroke-linecap="round"/>
    <rect x="96" y="184" width="52" height="7" rx="3" fill="#d4a85a" stroke="#140d07" stroke-width="2"/>
    <rect x="114" y="156" width="16" height="10" rx="3" fill="#61666d" stroke="#140d07" stroke-width="2"/>
    <path d="M 122 156 Q 126 146 136 146 Q 146 146 148 138" fill="none" stroke="#5a3d24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="148" cy="136" r="12" fill="url(#spark)"/>
    <g stroke="#ff8a1e" stroke-width="2.5" stroke-linecap="round">
      <path d="M 148 128 L 148 124 M 148 144 L 148 148 M 140 136 L 136 136 M 156 136 L 160 136"/>
      <path d="M 143 131 L 140 128 M 153 141 L 156 144 M 153 131 L 156 128 M 143 141 L 140 144"/>
    </g>
    <circle cx="148" cy="136" r="3.5" fill="#ffdc4a"/>
    <path d="M 158 124 Q 168 114 164 102" fill="none" stroke="#ece6d6" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <rect width="200" height="240" fill="url(#vign)"/>

  <!-- латунная рамка -->
  <rect x="6" y="6" width="188" height="228" rx="14" fill="none" stroke="url(#brass)" stroke-width="6"/>
  <rect x="13" y="13" width="174" height="214" rx="10" fill="none" stroke="#7d5a2c" stroke-width="2"/>
  <g fill="#ffd76a" stroke="#7d5a2c" stroke-width="1.5">
    <circle cx="16" cy="16" r="3.5"/><circle cx="184" cy="16" r="3.5"/>
    <circle cx="16" cy="224" r="3.5"/><circle cx="184" cy="224" r="3.5"/>
  </g>
  <!-- табличка -->
  <rect x="52" y="214" width="96" height="17" rx="4" fill="url(#brass)" stroke="#140d07" stroke-width="2"/>
  <text x="100" y="227" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="3" fill="#241708">ФИТИЛЬ</text>
</svg>
